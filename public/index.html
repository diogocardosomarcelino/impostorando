<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>IMPOSTORANDO - Jogos</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      user-select: none;
    }

    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background: #000000;
      color: #fff;
      min-height: 100dvh;
      overflow-x: hidden;
    }

    .container {
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding: 40px 24px 24px;
      gap: 32px;
    }

    .logo-img {
      width: 380px;
      max-width: 85vw;
      height: auto;
      display: block;
      margin: 0 auto;
      flex-shrink: 0;
    }

    .subtitle {
      font-size: 13px;
      color: #666;
      letter-spacing: 4px;
      text-align: center;
      text-transform: uppercase;
    }

    .game-cards {
      display: flex;
      flex-direction: column;
      gap: 16px;
      width: 100%;
      max-width: 360px;
      margin-top: 8px;
    }

    .game-card {
      background: #12122a;
      border: 2px solid #222;
      border-radius: 18px;
      padding: 24px 22px;
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      gap: 18px;
      text-decoration: none;
      color: inherit;
    }

    .game-card:active {
      transform: scale(0.97);
    }

    .game-card.impostor:hover {
      border-color: #ff4444;
      box-shadow: 0 0 30px rgba(255, 68, 68, 0.15);
    }

    .game-card.sintonia:hover {
      border-color: #4488ff;
      box-shadow: 0 0 30px rgba(68, 136, 255, 0.15);
    }

    .game-icon {
      font-size: 44px;
      flex-shrink: 0;
      width: 56px;
      text-align: center;
    }

    .game-info {
      display: flex;
      flex-direction: column;
      gap: 4px;
      flex: 1;
    }

    .game-title {
      font-size: 22px;
      font-weight: 900;
      letter-spacing: 4px;
      text-transform: uppercase;
    }

    .game-card.impostor .game-title {
      background: linear-gradient(135deg, #ff4444, #ff8800);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .game-card.sintonia .game-title {
      background: linear-gradient(135deg, #4488ff, #44ccdd);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .game-desc {
      font-size: 12px;
      color: #888;
      line-height: 1.4;
    }

    .game-tag {
      display: inline-block;
      font-size: 9px;
      letter-spacing: 1px;
      text-transform: uppercase;
      padding: 2px 8px;
      border-radius: 4px;
      margin-top: 6px;
      width: fit-content;
    }

    .game-card.impostor .game-tag {
      background: rgba(255, 68, 68, 0.15);
      color: #ff8800;
    }

    .game-card.sintonia .game-tag {
      background: rgba(68, 136, 255, 0.15);
      color: #44ccdd;
    }

    .footer {
      margin-top: auto;
      padding: 16px 0;
      text-align: center;
      font-size: 10px;
      color: #444;
      letter-spacing: 2px;
    }
  </style>
</head>
<body>
  <div class="container">
    <img src="/assets/logo.png" alt="IMPOSTORANDO" class="logo-img">
    <div class="subtitle">escolha um jogo</div>

    <div class="game-cards">
      <a href="/impostor" class="game-card impostor">
        <span class="game-icon">🕵️</span>
        <div class="game-info">
          <span class="game-title">IMPOSTOR</span>
          <span class="game-desc">Descubra quem é o impostor entre os jogadores</span>
          <span class="game-tag">3+ jogadores · dedução</span>
        </div>
      </a>

      <a href="/sintonia" class="game-card sintonia">
        <span class="game-icon">🎴</span>
        <div class="game-info">
          <span class="game-title">SINTONIA</span>
          <span class="game-desc">Joguem cartas em ordem crescente, sem se comunicar</span>
          <span class="game-tag">2-4 jogadores · cooperativo</span>
        </div>
      </a>
    </div>

    <div class="footer">IMPOSTORANDO.COM.BR</div>
  </div>
</body>
</html>
